name: Bug report
description: Report a reproducible problem in the FolseTech website.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to...\n2. Click...\n3. See..."
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Route / URL
      placeholder: /services/technical-seo
  - type: textarea
    id: environment
    attributes:
      label: Browser / device / environment
